<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Quiz - Simple Present</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --error: #EF4444;
      --error-bg: #FEE2E2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border: 2px solid #E5E7EB;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .error-msg {
      color: var(--error);
      background-color: var(--error-bg);
      border: 1px solid var(--error);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 15px;
      display: none;
      text-align: center;
      font-weight: 600;
    }

    /* Quiz Styling */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: bold;
      color: #6B7280;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #F9FAFB;
      color: var(--text);
      border: 2px solid #E5E7EB;
      text-align: left;
    }

    .option-btn:hover {
      background: #EEF2FF;
      border-color: var(--primary);
    }

    /* Ranking Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #E5E7EB;
    }

    th {
      background-color: #F9FAFB;
      color: #4B5563;
    }

    tr:nth-child(even) {
      background-color: #F9FAFB;
    }

    .highlight {
      background-color: #FEF3C7 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- TELA INICIAL -->
    <div id="screen-start" class="screen active">
      <h1>English Quiz</h1>
      <p style="text-align: center; margin-bottom: 20px; color: #6B7280;">Complete com <i>am</i>, <i>is</i> ou <i>are</i></p>
      
      <div class="form-group">
        <label for="student-turma">Turma:</label>
        <select id="student-turma">
          <option value="">Selecione a sua turma...</option>
          <option value="MICKEY">6º Ano - MICKEY (Manhã)</option>
          <option value="MINNIE">6º Ano - MINNIE (Manhã)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="student-name">Nome do Aluno:</label>
        <select id="student-name">
          <option value="">Primeiro selecione a turma...</option>
        </select>
      </div>

      <button id="btn-start" type="button">Iniciar Quiz</button>
      
      <div id="name-error" class="error-msg"></div>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <span id="question-tracker">Questão 1/10</span>
        <span id="timer-display">Tempo: 0s</span>
      </div>

      <div class="question-text" id="question-text">Carregando...</div>

      <div class="options" id="options-container"></div>
    </div>

    <!-- TELA DE RESULTADO & RANKING -->
    <div id="screen-ranking" class="screen">
      <h2>Top 10 Ranking</h2>
      <p id="user-result-summary" style="text-align: center; margin-bottom: 15px; font-weight: 500;"></p>
      
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Turma</th>
            <th>Acertos</th>
            <th>Tempo</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          <tr><td colspan="5" style="text-align: center;">Carregando ranking...</td></tr>
        </tbody>
      </table>

      <button id="btn-restart" type="button" style="margin-top: 20px;">Fazer Novamente</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CREDENCIAIS DO SUPABASE (Substitua aqui)
    // ==========================================
    const SUPABASE_URL = https://ufdklgbmrsjjikrtcass.supabase.co;
    const SUPABASE_KEY = sb_publishable_-84z_EVg00oVgD6g8P3XFw_yf0Czqey;
    
    let db = null;
    try {
      if (typeof window.supabase !== 'undefined' && SUPABASE_URL !== "SUA_SUPABASE_URL_AQUI") {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.warn("Supabase não inicializado:", e);
    }

    // ==========================================
    // 2. PAUTA OFICIAL DE ALUNOS
    // ==========================================
    const roster = {
      "MICKEY": [
        "ANTONIO BITTENCOURT NETO", "DAVI SYDHARTA DEDA", "EDGARD MENEZES SILVA NETO",
        "ESTHER TRINDADE MOTA", "FILIPE DANTAS DE ANDRADE GOIS", "HELENA OLIVEIRA DE MELO",
        "ISABELLY VITORIA CONCEICAO ARAGAO", "ISADORA BARBOSA SANTOS CRUZ", "JOAO GABRIEL NASCIMENTO SIQUEIRA",
        "JOSE DANILO FARIAS SANTANA", "JOSE PAIVA DO NASCIMENTO NETO", "KLARA SOFIA DE OLIVEIRA SANTOS",
        "LAURA ANDRADE DE OLIVEIRA FERREIRA", "LAURA SOARES CARMELO", "LETICIA PINHEIRO CABRAL",
        "LIVIA VITORIA DE SOUSA ANDRADE", "LUCAS ALVES DE SOUZA", "LUCAS BARRETO SIQUEIRA",
        "LUIZA MELO MATOS ANDRADE", "MARIA ANTONIA CAVALCANTE DE HOLLANDA", "MARIA LUISA COSTA BUARQUE",
        "MARIA RITA MENDONÇA PASSOS", "MARINA ALMEIDA DIAS", "PEDRO MIGUEL OLIVEIRA LUCENA",
        "RENATA MONTEIRO CARDOSO LESSA DE CARVALHO LEITE", "VITOR FARNESE ANDRADE", "YASMIN CATHERINE NUNES CARREGOSA"
      ],
      "MINNIE": [
        "ANA JÚLIA MARQUES DOREA", "ANA LUIZA SANTOS PASSOS", "ARTHUR LESSA SOUZA",
        "AYLA VALENTINA ARIMATEIA OLIVEIRA", "CAIO FILIPE VIEIRA LEMOS", "DAVI MACIEL ALMEIDA GUIMARÃES",
        "EMILLY DAMASCENO COLACO PINTO", "ENRICO FERNANDES SILVEIRA ARAGÃO", "GABRIEL PRADO SILVA",
        "GUSTAVO BRIANT ARIMATEA ROCHA", "HELENA AZEVEDO VASCONCELOS TEIXEIRA", "HELENA DE OLIVEIRA GONÇALVES MONTEIRO",
        "LARA LOPES BRANDAO", "LAURA ALMEIDA MENDONÇA", "LAURA BARBOSA DE SANTANA",
        "LEONARDO OLIVEIRA GONÇALVES GOUVEIA", "LETICIA SOBRAL NASCIMENTO", "LUCAS GUILHERME ARAUJO REIS",
        "LUÍS NATAN SOARES SANTOS", "LUIZ HENRIQUE NASCIMENTO SOARES", "MARIA CECÍLIA ARCE CAMPOS",
        "MARIA CECILIA ARQUIMEDES SOARES CHAGAS", "MARIA LAURA SILVA CORREIA", "MARIA LUIZA DE OLIVEIRA COSTA",
        "MELISSA LIMA SANTOS FERREIRA", "OTTO LOPES CRUZ DE CARVALHO ANDRADE", "ROSA HELENA SOARES ALVES SANTOS"
      ]
    };

    const quizQuestions = [
      { prompt: "1. She ___ a very good student.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "2. I ___ happy to see you today.", options: ["am", "is", "are"], answer: "am" },
      { prompt: "3. They ___ playing in the garden.", options: ["am", "is", "are"], answer: "are" },
      { prompt: "4. He ___ my best friend.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "5. We ___ ready for the test.", options: ["am", "is", "are"], answer: "are" },
      { prompt: "6. The cat ___ sleeping on the sofa.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "7. You ___ late for school.", options: ["am", "is", "are"], answer: "are" },
      { prompt: "8. It ___ cold outside today.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "9. I ___ 11 years old.", options: ["am", "is", "are"], answer: "am" },
      { prompt: "10. Paul and Mary ___ teachers.", options: ["am", "is", "are"], answer: "are" }
    ];

    let currentUser = { name: "", turma: "" };
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval = null;
    let totalSeconds = 0;

    // EVENT LISTENER PARA ATUALIZAR OS NOMES
    document.getElementById('student-turma').addEventListener('change', function() {
      const selectedTurma = this.value;
      const nameSelect = document.getElementById('student-name');

      nameSelect.innerHTML = '';

      if (!selectedTurma || !roster[selectedTurma]) {
        nameSelect.innerHTML = '<option value="">Primeiro selecione a turma...</option>';
        return;
      }

      const defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.innerText = 'Selecione o seu nome na lista...';
      nameSelect.appendChild(defaultOpt);

      roster[selectedTurma].forEach(studentName => {
        const opt = document.createElement('option');
        opt.value = studentName;
        opt.innerText = studentName;
        nameSelect.appendChild(opt);
      });
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // INICIAR O QUIZ
    document.getElementById('btn-start').addEventListener('click', function() {
      const turmaInput = document.getElementById('student-turma').value;
      const nameInput = document.getElementById('student-name').value;
      const errorMsg = document.getElementById('name-error');

      errorMsg.style.display = 'none';

      if (!turmaInput) {
        errorMsg.innerText = "Por favor, selecione a sua turma antes de continuar.";
        errorMsg.style.display = 'block';
        return;
      }

      if (!nameInput) {
        errorMsg.innerText = "Por favor, selecione o seu nome na lista da turma.";
        errorMsg.style.display = 'block';
        return;
      }

      currentUser = { name: nameInput, turma: turmaInput };
      currentQuestionIndex = 0;
      score = 0;
      totalSeconds = 0;

      showScreen('screen-quiz');
      
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        totalSeconds++;
        document.getElementById('timer-display').innerText = `Tempo: ${totalSeconds}s`;
      }, 1000);

      loadQuestion();
    });

    function loadQuestion() {
      const q = quizQuestions[currentQuestionIndex];
      document.getElementById('question-tracker').innerText = `Questão ${currentQuestionIndex + 1}/${quizQuestions.length}`;
      document.getElementById('question-text').innerText = q.prompt;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(opt);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selected) {
      if (selected === quizQuestions[currentQuestionIndex].answer) {
        score++;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex < quizQuestions.length) {
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    async function finishQuiz() {
      clearInterval(timerInterval);

      showScreen('screen-ranking');
      document.getElementById('user-result-summary').innerText = 
        `Parabéns, ${currentUser.name}! Você acertou ${score} de ${quizQuestions.length} em ${totalSeconds} segundos.`;

      if (db) {
        try {
          await db.from('ranking').insert([
            { 
              student_name: currentUser.name, 
              turma: currentUser.turma, 
              score: score, 
              time_seconds: totalSeconds 
            }
          ]);
        } catch (err) {
          console.error("Erro ao gravar no Supabase:", err);
        }
      }

      fetchRanking();
    }

    async function fetchRanking() {
      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Carregando ranking...</td></tr>';

      if (!db) {
        tbody.innerHTML = `
          <tr class="highlight">
            <td>1º</td>
            <td>${currentUser.name}</td>
            <td>${currentUser.turma}</td>
            <td>${score}/10</td>
            <td>${totalSeconds}s</td>
          </tr>
        `;
        return;
      }

      try {
        const { data, error } = await db
          .from('ranking')
          .select('*')
          .order('score', { ascending: false })
          .order('time_seconds', { ascending: true })
          .limit(10);

        if (error) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Erro ao carregar do Supabase.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        data.forEach((row, index) => {
          const tr = document.createElement('tr');
          if (row.student_name === currentUser.name && row.score === score && row.time_seconds === totalSeconds) {
            tr.classList.add('highlight');
          }

          tr.innerHTML = `
            <td>${index + 1}º</td>
            <td>${row.student_name}</td>
            <td>${row.turma}</td>
            <td>${row.score}/10</td>
            <td>${row.time_seconds}s</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Erro de conexão com o banco de dados.</td></tr>';
      }
    }

    document.getElementById('btn-restart').addEventListener('click', function() {
      document.getElementById('student-turma').value = '';
      document.getElementById('student-name').innerHTML = '<option value="">Primeiro selecione a turma...</option>';
      showScreen('screen-start');
    });
  </script>
</body>
</html>
