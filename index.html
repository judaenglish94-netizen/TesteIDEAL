<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Quiz - Simple Present</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --error: #EF4444;
      --success: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #E5E7EB;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .error-msg {
      color: var(--error);
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }

    /* Quiz Styling */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: bold;
      color: #6B7280;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #F9FAFB;
      color: var(--text);
      border: 2px solid #E5E7EB;
      text-align: left;
    }

    .option-btn:hover {
      background: #EEF2FF;
      border-color: var(--primary);
    }

    /* Ranking Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #E5E7EB;
    }

    th {
      background-color: #F9FAFB;
      color: #4B5563;
    }

    tr:nth-child(even) {
      background-color: #F9FAFB;
    }

    .highlight {
      background-color: #FEF3C7 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- TELA INITIAL / IDENTIFICAÇÃO -->
    <div id="screen-start" class="screen active">
      <h1>English Quiz</h1>
      <p style="text-align: center; margin-bottom: 20px; color: #6B7280;">Complete com <i>am</i>, <i>is</i> ou <i>are</i></p>
      
      <div class="form-group">
        <label for="student-name">Nome Completo:</label>
        <input type="text" id="student-name" placeholder="Digite seu nome conforme a chamada..." />
        <div id="name-error" class="error-msg">Nome não encontrado na lista da turma selecionada. Por favor, verifique a grafia e digite seu nome completo.</div>
      </div>

      <div class="form-group">
        <label for="student-turma">Turma:</label>
        <select id="student-turma">
          <option value="">Selecione a sua turma...</option>
          <option value="MICKEY">6º Ano - MICKEY (Manhã)</option>
          <option value="MINNIE">6º Ano - MINNIE (Manhã)</option>
        </select>
      </div>

      <button id="btn-start">Iniciar Quiz</button>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <span id="question-tracker">Questão 1/10</span>
        <span id="timer-display">Tempo: 0s</span>
      </div>

      <div class="question-text" id="question-text">Carregando...</div>

      <div class="options" id="options-container"></div>
    </div>

    <!-- TELA DE RESULTADO & RANKING -->
    <div id="screen-ranking" class="screen">
      <h2>Top 10 Ranking</h2>
      <p id="user-result-summary" style="text-align: center; margin-bottom: 15px; font-weight: 500;"></p>
      
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Turma</th>
            <th>Acertos</th>
            <th>Tempo</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          <tr><td colspan="5" style="text-align: center;">Carregando ranking...</td></tr>
        </tbody>
      </table>

      <button id="btn-restart" style="margin-top: 20px;">Fazer Novamente</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÃO DO SUPABASE
    // ==========================================
    const SUPABASE_URL = "SUA_SUPABASE_URL_AQUI";
    const SUPABASE_KEY = "SUA_SUPABASE_ANON_KEY_AQUI";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // BANCO DE DADOS DE ALUNOS (EXTRAÍDO DOS PDFS)
    // ==========================================
    const roster = {
      "MICKEY": [
        "ANTONIO BITTENCOURT NETO"[cite: 1],
        "DAVI SYDHARTA DEDA"[cite: 1],
        "EDGARD MENEZES SILVA NETO"[cite: 1],
        "ESTHER TRINDADE MOTA"[cite: 1],
        "FILIPE DANTAS DE ANDRADE GOIS"[cite: 1],
        "HELENA OLIVEIRA DE MELO"[cite: 1],
        "ISABELLY VITORIA CONCEICAO ARAGAO"[cite: 1],
        "ISADORA BARBOSA SANTOS CRUZ"[cite: 1],
        "JOAO GABRIEL NASCIMENTO SIQUEIRA"[cite: 1],
        "JOSE DANILO FARIAS SANTANA"[cite: 1],
        "JOSE PAIVA DO NASCIMENTO NETO"[cite: 1],
        "KLARA SOFIA DE OLIVEIRA SANTOS"[cite: 1],
        "LAURA ANDRADE DE OLIVEIRA FERREIRA"[cite: 1],
        "LAURA SOARES CARMELO"[cite: 1],
        "LETICIA PINHEIRO CABRAL"[cite: 1],
        "LIVIA VITORIA DE SOUSA ANDRADE"[cite: 1],
        "LUCAS ALVES DE SOUZA"[cite: 1],
        "LUCAS BARRETO SIQUEIRA"[cite: 1],
        "LUIZA MELO MATOS ANDRADE"[cite: 1],
        "MARIA ANTONIA CAVALCANTE DE HOLLANDA"[cite: 1],
        "MARIA LUISA COSTA BUARQUE"[cite: 1],
        "MARIA RITA MENDONÇA PASSOS"[cite: 1],
        "MARINA ALMEIDA DIAS"[cite: 1],
        "PEDRO MIGUEL OLIVEIRA LUCENA"[cite: 1],
        "RENATA MONTEIRO CARDOSO LESSA DE CARVALHO LEITE"[cite: 1],
        "VITOR FARNESE ANDRADE"[cite: 1],
        "YASMIN CATHERINE NUNES CARREGOSA"[cite: 1]
      ],
      "MINNIE": [
        "ANA JÚLIA MARQUES DOREA"[cite: 3],
        "ANA LUIZA SANTOS PASSOS"[cite: 3],
        "ARTHUR LESSA SOUZA"[cite: 3],
        "AYLA VALENTINA ARIMATEIA OLIVEIRA"[cite: 3],
        "CAIO FILIPE VIEIRA LEMOS"[cite: 3],
        "DAVI MACIEL ALMEIDA GUIMARÃES"[cite: 3],
        "EMILLY DAMASCENO COLACO PINTO"[cite: 3],
        "ENRICO FERNANDES SILVEIRA ARAGÃO"[cite: 3],
        "GABRIEL PRADO SILVA"[cite: 3],
        "GUSTAVO BRIANT ARIMATEA ROCHA"[cite: 3],
        "HELENA AZEVEDO VASCONCELOS TEIXEIRA"[cite: 3],
        "HELENA DE OLIVEIRA GONÇALVES MONTEIRO"[cite: 3],
        "LARA LOPES BRANDAO"[cite: 3],
        "LAURA ALMEIDA MENDONÇA"[cite: 3],
        "LAURA BARBOSA DE SANTANA"[cite: 3],
        "LEONARDO OLIVEIRA GONÇALVES GOUVEIA"[cite: 3],
        "LETICIA SOBRAL NASCIMENTO"[cite: 3],
        "LUCAS GUILHERME ARAUJO REIS"[cite: 3],
        "LUÍS NATAN SOARES SANTOS"[cite: 3],
        "LUIZ HENRIQUE NASCIMENTO SOARES"[cite: 3],
        "MARIA CECÍLIA ARCE CAMPOS"[cite: 3],
        "MARIA CECILIA ARQUIMEDES SOARES CHAGAS"[cite: 3],
        "MARIA LAURA SILVA CORREIA"[cite: 3],
        "MARIA LUIZA DE OLIVEIRA COSTA"[cite: 3],
        "MELISSA LIMA SANTOS FERREIRA"[cite: 3],
        "OTTO LOPES CRUZ DE CARVALHO ANDRADE"[cite: 3],
        "ROSA HELENA SOARES ALVES SANTOS"[cite: 3]
      ]
    };

    // ==========================================
    // PERGUNTAS DO QUIZ (AM / IS / ARE)
    // ==========================================
    const quizQuestions = [
      { prompt: "1. She ___ a very good student.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "2. I ___ happy to see you today.", options: ["am", "is", "are"], answer: "am" },
      { prompt: "3. They ___ playing in the garden.", options: ["am", "is", "are"], answer: "are" },
      { prompt: "4. He ___ my best friend.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "5. We ___ ready for the test.", options: ["am", "is", "are"], answer: "are" },
      { prompt: "6. The cat ___ sleeping on the sofa.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "7. You ___ late for school.", options: ["am", "is", "are"], answer: "are" },
      { prompt: "8. It ___ cold outside today.", options: ["am", "is", "are"], answer: "is" },
      { prompt: "9. I ___ 11 years old.", options: ["am", "is", "are"], answer: "am" },
      { prompt: "10. Paul and Mary ___ teachers.", options: ["am", "is", "are"], answer: "are" }
    ];

    // ESTADO DA APLICAÇÃO
    let currentUser = { name: "", turma: "" };
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval = null;
    let totalSeconds = 0;

    // HELPER: NORMALIZAÇÃO DE TEXTO (Ignora acentos e maiúsculas/minúsculas)
    function normalizeText(text) {
      return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .trim()
        .replace(/\s+/g, ' ');
    }

    // NAVEGAÇÃO ENTRE TELAS
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // VALIDAR E INICIAR QUIZ
    document.getElementById('btn-start').addEventListener('click', () => {
      const nameInput = document.getElementById('student-name').value;
      const turmaInput = document.getElementById('student-turma').value;
      const errorMsg = document.getElementById('name-error');

      if (!turmaInput) {
        alert("Por favor, selecione uma turma.");
        return;
      }

      const normalizedInput = normalizeText(nameInput);
      const classList = roster[turmaInput] || [];
      
      // Busca correspondência exata desconsiderando acentos e caixas
      const foundStudent = classList.find(student => normalizeText(student) === normalizedInput);

      if (!foundStudent) {
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      currentUser = { name: foundStudent, turma: turmaInput };

      startQuiz();
    });

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      totalSeconds = 0;

      showScreen('screen-quiz');
      
      // Inicia o Cronômetro
      timerInterval = setInterval(() => {
        totalSeconds++;
        document.getElementById('timer-display').innerText = `Tempo: ${totalSeconds}s`;
      }, 1000);

      loadQuestion();
    }

    function loadQuestion() {
      const q = quizQuestions[currentQuestionIndex];
      document.getElementById('question-tracker').innerText = `Questão ${currentQuestionIndex + 1}/${quizQuestions.length}`;
      document.getElementById('question-text').innerText = q.prompt;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(opt);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selected) {
      if (selected === quizQuestions[currentQuestionIndex].answer) {
        score++;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex < quizQuestions.length) {
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    async function finishQuiz() {
      clearInterval(timerInterval);

      showScreen('screen-ranking');
      document.getElementById('user-result-summary').innerText = 
        `Parabéns, ${currentUser.name}! Você acertou ${score} de ${quizQuestions.length} em ${totalSeconds} segundos.`;

      // Envia os dados para o Supabase
      try {
        await db.from('ranking').insert([
          { 
            student_name: currentUser.name, 
            turma: currentUser.turma, 
            score: score, 
            time_seconds: totalSeconds 
          }
        ]);
      } catch (err) {
        console.error("Erro ao salvar no Supabase:", err);
      }

      // Atualiza e exibe o Ranking
      fetchRanking();
    }

    async function fetchRanking() {
      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Carregando ranking...</td></tr>';

      // Consulta os dados ordenados: maior pontuação primeiro; em caso de empate, menor tempo
      const { data, error } = await db
        .from('ranking')
        .select('*')
        .order('score', { ascending: false })
        .order('time_seconds', { ascending: true })
        .limit(10);

      if (error) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Erro ao carregar o ranking.</td></tr>';
        console.error(error);
        return;
      }

      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhuma resposta registrada ainda.</td></tr>';
        return;
      }

      data.forEach((row, index) => {
        const tr = document.createElement('tr');
        
        // Destaca se for o resultado da tentativa atual
        if (row.student_name === currentUser.name && row.score === score && row.time_seconds === totalSeconds) {
          tr.classList.add('highlight');
        }

        tr.innerHTML = `
          <td>${index + 1}º</td>
          <td>${row.student_name}</td>
          <td>${row.turma}</td>
          <td>${row.score}/10</td>
          <td>${row.time_seconds}s</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      showScreen('screen-start');
    });
  </script>
</body>
</html>
